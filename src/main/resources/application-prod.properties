# Ative com SPRING_PROFILES_ACTIVE=prod. Nenhum segredo possui valor padrao.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework

bemdoar.jwt.secret=${BEMDOAR_JWT_SECRET}
bemdoar.jwt.expiracao=${BEMDOAR_JWT_EXPIRACAO:28800000}
bemdoar.cors.origem=${BEMDOAR_CORS_ORIGEM}
bemdoar.upload.diretorio=${BEMDOAR_UPLOAD_DIRETORIO}
